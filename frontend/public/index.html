<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Go To Dream — билеты, отели и туры</title>
    <meta name="description" content="Перелёты, отели, туры и трансферы в одном интерфейсе: поиск, сравнение и бронирование поездки целиком." />

    <!-- Цвет строки состояния мобильного браузера. Значение подменяет
         скрипт ниже вместе с темой; здесь стоит тёмное как значение по
         умолчанию — оно же основное оформление сайта. -->
    <meta name="theme-color" content="#0A0C0E" />

    <!-- Иконки. favicon.svg масштабируется без потерь и умеет откликаться
         на тёмную тему браузера, .ico нужен старым версиям Safari и
         Windows-ярлыкам, apple-touch-icon — для «на экран Домой» в iOS
         (там прозрачность не поддерживается, поэтому фон непрозрачный). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Тема выставляется ДО загрузки бандла.

      Зачем отдельный скрипт, если то же самое делает src/theme/theme.js.
      Всё, что лежит в бандле, выполняется после его загрузки и разбора —
      это десятки миллисекунд на быстрой сети и заметно больше на медленной.
      Всё это время документ стоит без атрибута data-theme, то есть в теме
      по умолчанию (тёмной). Человек с выбранной светлой темой видит вспышку
      тёмного экрана при каждом открытии сайта. Скрипт ниже — единственный
      способ этого избежать: он синхронный, стоит в <head> и отрабатывает
      раньше первой отрисовки.

      ЧТО ЛЕЖИТ В ХРАНИЛИЩЕ: "system" | "light" | "dark" — предпочтение
      человека, а не действующая тема. "system" (и отсутствие значения, и
      любой мусор) означает «как на устройстве»: тогда тема берётся из
      prefers-color-scheme и дальше, уже в React, меняется вживую вместе с
      системной настройкой.

      ЦЕНА РЕШЕНИЯ: логика выбора темы существует в двух местах. Здесь она
      сведена к минимуму (ключ хранилища и системный запрос), всё остальное —
      в src/theme/theme.js. При изменении ключа "gtd-theme" правьте ОБА
      файла; ключ намеренно один и тот же, найти второе вхождение можно
      поиском по строке.

      try/catch: обращение к localStorage бросает исключение в приватном
      режиме Safari и при запрещённых сайтовых данных. Упасть здесь означало
      бы не отрисовать страницу вообще.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('gtd-theme'); } catch (e) {}
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: light)').matches
               ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F6F8' : '#0A0C0E');
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы сайта нужен включённый JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
