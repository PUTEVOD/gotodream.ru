<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0C0E" />

    <!--
      Тема выставляется ДО загрузки бандла.

      Зачем отдельный скрипт, если то же самое делает src/theme/theme.js.
      Всё, что лежит в бандле, выполняется после его загрузки и разбора —
      это десятки миллисекунд на быстрой сети и заметно больше на медленной.
      Всё это время документ стоит без атрибута data-theme, то есть в теме
      по умолчанию (тёмной). Человек с выбранной светлой темой видит вспышку
      тёмного экрана при каждом открытии сайта. Скрипт ниже — единственный
      способ этого избежать: он синхронный, стоит в <head> и отрабатывает
      раньше первой отрисовки.

      ЦЕНА РЕШЕНИЯ: логика выбора темы существует в двух местах. Здесь она
      сведена к минимуму (ключ хранилища и системный запрос), всё остальное —
      в src/theme/theme.js. При изменении ключа "gtd-theme" правьте ОБА
      файла; ключ намеренно один и тот же, найти второе вхождение можно
      поиском по строке.

      try/catch: обращение к localStorage бросает исключение в приватном
      режиме Safari и при запрещённых сайтовых данных. Упасть здесь означало
      бы не отрисовать страницу вообще.
    -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('gtd-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F6F8' : '#0A0C0E');
      })();
    </script>
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Go to Dream</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
